# Supabase production deployment configuration template for ReachIQ.
# Copy this file to `supabase/config.toml` in CI or local production deploy runs,
# then set the correct project_ref and URLs for your environment.

project_id = "your-supabase-project-ref"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions", "app"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://your-production-domain.com"
additional_redirect_urls = [
  "https://your-production-domain.com/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[storage]
enabled = true
file_size_limit = "100MiB"
